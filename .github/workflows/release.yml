name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: git diff --check

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          archive="agent-preview_${GOOS}_${GOARCH}.tar.gz"
          mkdir -p package
          go build -trimpath \
            -ldflags "-s -w -X github.com/Zhangs-11/agent-preview/internal/app.Version=${GITHUB_REF_NAME}" \
            -o package/agent-preview ./cmd/agent-preview
          cp README.md README_EN.md LICENSE package/
          tar -C package -czf "${archive}" agent-preview README.md README_EN.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: agent-preview-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent-preview_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-preview-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum agent-preview_*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
